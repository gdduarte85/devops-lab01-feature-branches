name: CI Pipeline

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install flask

      - name: Run Code Quality Checks
        run: |
          flake8 .

      - name: Run Unit Tests
        run: |
          python -m unittest
